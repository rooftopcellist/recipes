theme: jekyll-theme-slate
baseurl: /recipes

plugins:
  - jekyll-optional-front-matter
  - jekyll-default-layout
  - jekyll-titles-from-headings
  - jekyll-relative-links

# Keep tooling and local credentials out of the public site.
exclude:
  - recipe_automation
  - vendor
  - Makefile
  - credentials.json
  - google-form-link.txt
